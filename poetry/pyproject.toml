[tool.poetry]
name = "dgenerate"
version = "0.0.0"
description = "Stable diffusion batch image generation tool."
authors = ["Teriks <Teriks@users.noreply.github.com>"]
readme = "README.rst"
license = "BSD 3-Clause"

[tool.poetry.dependencies]
python = ">=3.11,!=3.14.1,<3.15"
diffusers = "0.40.0"
huggingface_hub = "^1.32.0"
datasets = "^5.0.1"
hf_xet = "^1.6.0"
bitsandbytes = "0.50.2"
peft = "0.21.0"
transformers = "5.17.0"
accelerate = "1.15.0"
sdnq = "0.2.6"
DeepCache = "0.1.1"
patchmatch-cython = "^0.1.5"
dynamicprompts = "0.31.0"
spacy = "3.8.16"
dgenerate-ultralytics-headless = {version = "8.4.160", platform = "not_darwin"}
langcodes = "^3.5.1"
pytorch-lightning = "^2.6.6"
lightning-utilities = "^0.15.3"
charset-normalizer = "^3.5.1"
lightning-fabric = "^2.6.6"
omegaconf = "^2.3.1"
requests = "^2.34.2"
av = "^18.1.0"
pillow = "^12.3.0"
piexif = "^1.1.3"
jinja2 = "^3.1.6"
torch = { version = "2.14.0", source = "pypi" }
torchvision = {version = "0.29.0", source = "pypi"}
torchsde = "0.2.6"
fake-useragent = "2.2.0"
opencv-python-headless = "^5.0.0.93"
psutil = "^7.2.2"
sentencepiece = "^0.2.2"
ftfy = "^6.3.1"
beautifulsoup4 = "^4.15.0"
matplotlib = "^3.11.2"
filelock = "^4.0.1"
importlib_metadata = "^9.0.1"
scipy = ">=1.16.3,<2"
einops = "^0.8.2"
timm = "^1.0.30"
scikit-image = "^0.26.0"
numpy = ">=2.3.5,<3"
spandrel = "^0.4.2"
spandrel_extra_arches = "^0.2.0"
asteval = "^1.0.10"
pygments = "^2.21.0"
toml = "^0.10.2"
tklinenums = "^1.7.1"
pyrfc6266 = "^1.0.2"
protobuf = "^7.36.2"
lark = "^1.3.1"
packaging = "^26.3"
ctranslate2 = "^4.8.2"
sacremoses = "0.2.0"
preshed = "^3.0.13"
ncnn = "1.0.20260526"
xllamacpp = "2026.9.11063"
pyopengltk = "0.0.4"
pyopengl = "3.1.10"
pyopengl-accelerate = "3.1.10"
triton-windows = "3.8.0.post28"

[tool.poetry.scripts]
dgenerate = 'dgenerate.__init__:main'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
